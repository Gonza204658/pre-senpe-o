<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini App - Productos</title>
</head>
<body>

  <h1>Gestión de Productos</h1>
  <p>Completa el formulario y haz clic en Agregar.</p>

  <!-- Formulario para agregar productos -->
  <input type="text" id="inputNombre" placeholder="Nombre del producto" />
  <input type="number" id="inputPrecio" placeholder="Precio" />
  <input type="text" id="inputDescripcion" placeholder="Descripción" />
  <button id="btnAgregar">Agregar</button>
  <button id="btnSincronizar">Sincronizar con API</button>

  <p id="mensajeError" style="color: red; display: none;"></p>
  <p id="mensajeExito" style="color: green; display: none;"></p>

  <!-- Lista donde se renderizan los productos -->
  <ul id="listaProductos"></ul>

  <script src="app.js"></script>
</body>
</html>
